async function team(name,nat){const k=name.toLowerCase()+(nat?"|n":"");if(TH[k]!==undefined)return TH[k];
 const c=LS.get("c2_t_"+k,null);if(c&&c.v&&Date.now()-c.t<12*36e5){TH[k]=c.v;return c.v}
 WHY[k]="";const sq=name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 ]+/g," ").replace(/\s+/g," ").trim();if(sq.length<3){TH[k]=null;return null}
 try{const j=await api("/af-team?name="+encodeURIComponent(sq)+"&stats=0&nat="+(nat?1:0));let v=null;
  if(j.found){v=(j.matches||[]).filter(x=>x.ft&&x.ft.home!=null&&x.ft.away!=null).map(x=>{const hm=x.home!==false,ft=x.ft,ht=x.ht,gf=hm?ft.home:ft.away,ga=hm?ft.away:ft.home,hk=ht&&ht.home!=null&&ht.away!=null;
   return{gf,ga,hm,hd:hk?(ht.home==ht.away?1:0):null,h1:hk?(ht.home+ht.away>0?1:0):null,h2:hk?((ft.home+ft.away)-(ht.home+ht.away)>0?1:0):null}}).slice(-7);RAW[k]=v;const ok=v.filter(z=>z.gf+z.ga<10);if(v.length-ok.length>=2){v=null;WHY[k]="bad"}else{v=ok;if(v.length<3){WHY[k]="short";v=null}}}else WHY[k]="nf"

/* ---------- modelul Crown (fără cote) ---------- */
const G=1.35,shr=(v,n)=>(v*n+G*2)/(n+2);
const pois=(l,k)=>{let r=Math.exp(-l);for(let i=1;i<=k;i++)r*=l/i;return r};
function side(L,home){const s=L.filter(x=>x.hm===home),u=s.length>=3?s:L,w=u===L?1:.6,f=(a,k)=>a.reduce((t,x)=>t+x[k],0)/a.length;return{gf:w*f(u,"gf")+(1-w)*f(L,"gf"),ga:w*f(u,"ga")+(1-w)*f(L,"ga")}}
function half(A,B,k,pr){const f=L=>{const x=L.map(y=>y[k]).filter(y=>y!=null);return x.length>=3?(x.reduce((s,y)=>s+y,0)+pr*2)/(x.length+2):null};const p=f(A),q=f(B);return p==null||q==null?null:r1((p+q)/2*100)}
function model(A,B){if(!A||!B||A.length<3||B.length<3)return null;
 const a=side(A,true),b=side(B,false);
 const lh=Math.max(.2,(shr(a.gf,A.length)+shr(b.ga,B.length))/2*1.08),la=Math.max(.2,(shr(b.gf,B.length)+shr(a.ga,A.length))/2*.93);
 let h=0,d=0,v=0,o15=0,o25=0,bt=0,t=0;
 for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){const q=pois(lh,i)*pois(la,j);t+=q;if(i>j)h+=q;else if(i==j)d+=q;else v+=q;if(i+j>1)o15+=q;if(i+j>2)o25+=q;if(i>0&&j>0)bt+=q}
 const P=x=>r1(x/t*100);let hp=0,t1=0;for(let k=0;k<=9;k++)hp+=pois(lh*.45,k)*pois(la*.45,k);for(let i=0;i<=9;i++)t1+=pois(lh*.45,i);const hf=half(A,B,"hd",.42);const hdv=r1(hf==null?hp*100:(hp*100+hf)/2);
 return{lh:r1(lh),la:r1(la),p:{h:P(h),d:P(d),a:P(v),o15:P(o15),o25:P(o25),btts:P(bt),h1:half(A,B,"h1",.72),h2:half(A,B,"h2",.82),hd:hdv}}}

const BOOKS=["Pinnacle","Betfair","Bet365","SBOBET"];
const SH={};
async function sharp(id){if(SH[id]!==undefined)return SH[id];try{const j=await api("/af-sharp?id="+id,40000);SH[id]=j.found?j.books:null;return SH[id]}catch(e){return null}}
function shp(sh,k){if(!sh)return null;for(const b of BOOKS){const x=sh[b];if(x&&x.p&&x.p[k]!=null)return{name:b,p:x.p[k],odds:x.odds?x.odds[k]:null,all:x}}return null}
function confidence(m,sh,nA,nB){if(!m)return 0;let c=Math.min(nA,nB)/7*70;if(m.p.h1!=null&&m.p.h2!=null)c+=15;
 const s=sh&&BOOKS.map(b=>sh[b]).find(x=>x&&x.p&&x.p.h!=null);
 if(s){const df=(Math.abs(m.p.h-s.p.h)+Math.abs(m.p.d-s.p.d)+Math.abs(m.p.a-s.p.a))/3;c+=df<=6?15:df>=14?-10:5}

const cfl=c=>c>=75?["a","Mare"]:c>=50?["b","Medie"]:["c","Mică"];

let LOG=LS.get("c2_log",{});const PR={};
(()=>{let ch=0;Object.keys(LOG).forEach(id=>{const e=LOG[id];if(!e.v&&natLg({league:{name:e.lg||"",country:""}})){delete LOG[id];ch=1}});if(ch)LS.set("c2_log",LOG)})();
function slim(sh){if(!sh)return null;const o={};BOOKS.forEach(b=>{if(sh[b])o[b]={p:sh[b].p,odds:sh[b].odds}});return o}
function fromLog(id){const e=LOG[id];return e?{m:{p:e.p},sh:e.sh,conf:e.conf,nA:e.n,nB:e.n,log:1}:null}
const getPR=id=>PR[id]||fromLog(id);
function saveLog(x){const r=PR[x.id];if(!r||!r.m)return;const ko=new Date(x.k).getTime(),e=LOG[x.id];
 if(!(x.st=="scheduled"&&ko>Date.now()))return;if(e&&(e.res||ko<Date.now()+5*6e4))return;
 LOG[x.id]={id:x.id,d:x.d,k:x.k,h:x.teams.home.name,a:x.teams.away.name,lg:x.league.name,v:2,ts:Date.now(),p:r.m.p,sh:slim(r.sh),conf:r.conf,n:Math.min(r.nA,r.nB),res:null};

async function calc(x){const nt=natLg(x),[A,B]=await Promise.all([team(x.teams.home.name,nt),team(x.teams.away.name,nt)]);
 const m=model(A,B);let sh=null;if(m&&(x.st=="scheduled"||x.st=="tbd"))sh=await sharp(x.id);
 const nA=A?A.length:0,nB=B?B.length:0;PR[x.id]={m,sh,A,B,nA,nB,conf:confidence(m,sh,nA,nB)};saveLog(x);return PR[x.id]}
async function pool(items,fn,n,cb){let i=0,done=0;const w=async()=>{while(i<items.length){const x=items[i++];try{await fn(x)}catch(e){}done++;if(cb)cb(done,items.length);await wait(60)}};await Promise.all(Array.from({length:n},w))}

  const M=new Map(((j.data&&j.data.matches)||[]).map(x=>[x.id,x]));
  for(const e of pend.filter(e=>e.d==d)){const x=M.get(e.id);if(!x)continue;
   if(x.short=="FT"&&x.goals&&x.goals.home!=null&&x.goals.away!=null){const ht=x.ht||{},hk=ht.home!=null&&ht.away!=null;
    e.res={gh:x.goals.home,ga:x.goals.away,hh:hk?ht.home:null,ha:hk?ht.away:null,h1:hk?(ht.home+ht.away>0?1:0):null,h2:hk?((x.goals.home+x.goals.away)-(ht.home+ht.away)>0?1:0):null};n++}
   else if(["AET","PEN","CANC","ABD","AWD","WO"].includes(x.short)){e.res={void:1}}}}

const MK=[["h","1X2"],["o15","Peste 1.5"],["o25","Peste 2.5"],["btts","Ambele marchează"],["h1","Gol repriza 1"],["h2","Gol repriza 2"],["hd","Egal la pauză"]];
function outc(e,k){const r=e.res;if(!r||r.void)return null;if(k=="o15")return r.gh+r.ga>1?1:0;if(k=="o25")return r.gh+r.ga>2?1:0;if(k=="btts")return r.gh>0&&r.ga>0?1:0;if(k=="hd")return r.hh==null?null:(r.hh==r.ha?1:0);return r[k]}
function metrics(){const out={},cal=[];for(const[k]of MK)out[k]={n:0,hit:0,br:0,ll:0,sn:0,sbr:0,sll:0,bets:0,pl:0};
 for(const e of Object.values(LOG)){if(!e.res||e.res.void)continue;
  for(const[k]of MK){const o=out[k];
   if(k=="h"){if(e.p.h==null)continue;const act=e.res.gh>e.res.ga?0:e.res.gh==e.res.ga?1:2,pr=[e.p.h,e.p.d,e.p.a].map(v=>v/100);
    o.n++;o.br+=pr.reduce((s,v,i)=>s+(v-(i==act?1:0))**2,0);o.ll+=-Math.log(Math.max(.01,pr[act]));o.hit+=pr.indexOf(Math.max(...pr))==act?1:0;pr.forEach((v,i)=>cal.push([v,i==act?1:0]));
    const s=shp(e.sh,"h");if(s){const sp=[s.all.p.h,s.all.p.d,s.all.p.a].map(v=>v/100);o.sn++;o.sbr+=sp.reduce((t,v,i)=>t+(v-(i==act?1:0))**2,0);o.sll+=-Math.log(Math.max(.01,sp[act]));
     const od=[s.all.odds.h,s.all.odds.d,s.all.odds.a];if(od.every(z=>z>1))for(let i=0;i<3;i++)if(pr[i]*od[i]-1>=.05){o.bets++;o.pl+=i==act?od[i]-1:-1}}}
   else{const pv=e.p[k],y=outc(e,k);if(pv==null||y==null)continue;const p=pv/100;o.n++;o.br+=(p-y)**2;o.ll+=-(y?Math.log(Math.max(.01,p)):Math.log(Math.max(.01,1-p)));o.hit+=(p>=.5)==!!y?1:0;cal.push([p,y]);

 return{out,cal}}

async function viewE(){const app=$("#app");app.innerHTML=`<div class="ct">Verific rezultatele…</div>`;let g=0;try{g=await grade()}catch(e){}if(S.tab!="e")return;

 app.innerHTML=`<div class="card"><h3>Evidența estimărilor</h3><div>${all.length} salvate · ${done.length} verificate · ${pend.length} în așteptare${vd.length?" · "+vd.length+" anulate/prelungiri":""}</div><div class="mu" style="margin-top:6px">Estimarea se salvează înainte de meci, apoi se compară cu rezultatul. Cu sub 100 de meciuri verificate cifrele nu spun nimic sigur.</div></div>
