<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}*{touch-action:manipulation}
:root{--bg:#07111f;--s1:#0d1b30;--s2:#12243d;--ln:#1e3557;--em:#19d38a;--bl:#4da3ff;--tx:#e8f0fa;--mu:#8aa0ba;--am:#f5b84b;--rd:#ef5b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:120px;background:radial-gradient(circle at 85% -5%,rgba(25,211,138,.16),transparent 45%),radial-gradient(circle at 0 20%,rgba(77,163,255,.10),transparent 40%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo span{font-weight:400;color:var(--mu)}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#19d38a,#0f7f6b);font-size:20px}
.mbtn{width:42px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);font-size:18px}
main{padding:6px 18px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:15px;margin:22px 0 10px;color:var(--mu);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--mu);font-size:14px}
.hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,#0f4a52 0%,#0d2a47 60%,#0d1b30 100%);border:1px solid var(--ln);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-18deg);animation:tsw 8s ease-in-out infinite;pointer-events:none}
.hb{position:absolute;right:10px;top:8px;width:132px;height:132px;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(25,211,138,.35));animation:hbf 4.6s ease-in-out infinite}
.hb .bl{transform-origin:70px 82px;animation:hbs 16s linear infinite}
.hb .orb{transform-origin:70px 82px;animation:hbs 7s linear infinite}
.hb .au{transform-origin:70px 82px;animation:hbp 3.2s ease-in-out infinite}
.hb .cr{animation:hbc 3.5s ease-in-out infinite}
.hb .sp{animation:tw 2.6s ease-in-out infinite}
@keyframes hbp{0%,100%{transform:scale(.88);opacity:.7}50%{transform:scale(1.08);opacity:1}}
@keyframes hbc{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3) drop-shadow(0 0 6px #ffe58a)}}
.hero{background:radial-gradient(circle at 80% 30%,rgba(25,211,138,.22),transparent 55%),linear-gradient(135deg,#0f4a52 0%,#0d2a47 60%,#0d1b30 100%);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg at 80% 35%,transparent 0 70%,rgba(244,194,58,.10) 80%,transparent 90%);animation:hbs 18s linear infinite;pointer-events:none}
.hb canvas{display:none;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:pan-y}
.hb.t3{pointer-events:auto;animation:none;filter:drop-shadow(0 8px 22px rgba(25,211,138,.4))}
.hb.t3 canvas{display:block}.hb.t3 svg .bl,.hb.t3 svg .bx{display:none}
.hb.t3 svg{animation:hbf 4.6s ease-in-out infinite}
@keyframes hbf{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes hbs{to{transform:rotate(360deg)}}
@keyframes tsw{0%,55%{left:-70%}100%{left:140%}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.75;transform:scale(1.15)}}
.tiles .tile{position:relative;overflow:hidden}
.tiles .tile::before{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);transform:skewX(-18deg);animation:tsw 7s ease-in-out infinite;pointer-events:none}
.tiles .tile::after{content:"✦";position:absolute;right:12px;top:9px;font-size:13px;color:#7fe9c0;animation:tw 3.2s ease-in-out infinite;pointer-events:none}
.tiles .tile:nth-child(2)::before{animation-delay:.8s}.tiles .tile:nth-child(3)::before{animation-delay:1.6s}.tiles .tile:nth-child(4)::before{animation-delay:2.4s}.tiles .tile:nth-child(5)::before{animation-delay:3.2s}.tiles .tile:nth-child(6)::before{animation-delay:4s}.tiles .tile:nth-child(7)::before{animation-delay:4.8s}
.tiles .tile:nth-child(2n)::after{animation-delay:1.1s}.tiles .tile:nth-child(3n)::after{animation-delay:2s}
@media (prefers-reduced-motion:reduce){.hb,.hb .bl,.hb .orb,.hb .au,.hb .cr,.hb .sp,.hero::before,.hero::after,.tiles .tile::before,.tiles .tile::after{animation:none}}
.hero .big{font-size:46px;font-weight:800;line-height:1}.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08)}
.tag.g{background:rgba(25,211,138,.18);color:var(--em)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;text-align:left}
.tile.w{grid-column:1/3;background:linear-gradient(135deg,#0e5a4a,#0d2f4a);border-color:#1b6b5b;display:flex;align-items:center;gap:14px}
