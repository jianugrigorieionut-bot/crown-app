<style>
:root{--bg:#07111f;--s1:#0d1b30;--s2:#12243d;--ln:#1e3557;--em:#19d38a;--bl:#4da3ff;--tx:#e8f0fa;--mu:#8aa0ba;--am:#f5b84b;--rd:#ef5b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:104px;background:radial-gradient(circle at 85% -5%,rgba(25,211,138,.16),transparent 45%),radial-gradient(circle at 0 20%,rgba(77,163,255,.10),transparent 40%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo span{font-weight:400;color:var(--mu)}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#19d38a,#0f7f6b);font-size:20px}
.mbtn{width:42px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);font-size:18px}
main{padding:6px 18px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:15px;margin:22px 0 10px;color:var(--mu);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--mu);font-size:14px}
.hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,#0f4a52 0%,#0d2a47 60%,#0d1b30 100%);border:1px solid var(--ln);position:relative;overflow:hidden}
.hero::after{content:"👑";position:absolute;right:-6px;top:-10px;font-size:110px;opacity:.08}
.hero .big{font-size:46px;font-weight:800;line-height:1}.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08)}
.tag.g{background:rgba(25,211,138,.18);color:var(--em)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;text-align:left}
.tile.w{grid-column:1/3;background:linear-gradient(135deg,#0e5a4a,#0d2f4a);border-color:#1b6b5b;display:flex;align-items:center;gap:14px}
.tile .ic{width:44px;height:44px;border-radius:14px;background:rgba(25,211,138,.15);display:grid;place-items:center;font-size:22px;margin-bottom:10px}.tile.w .ic{margin:0;background:rgba(255,255,255,.12)}
.tile b{display:block;font-size:16px}.tile small{color:var(--mu);font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,17,31,.96);border-top:1px solid var(--ln);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:11.5px;font-weight:700}
nav .ni{width:50px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:18px;filter:grayscale(1) opacity(.7)}
nav .on{color:var(--em)}nav .on .ni{background:rgba(25,211,138,.16);filter:none}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.days button{flex:1;min-width:62px;padding:8px 4px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font-size:12px;font-weight:700;text-transform:capitalize}
.days b{display:block;font-size:17px;color:var(--tx)}.days .on{background:var(--em);border-color:var(--em);color:#04281c}.days .on b{color:#04281c}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.in,.sel{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:15px;outline:0}.in:focus{border-color:var(--em)}
.sel{appearance:none;-webkit-appearance:none;font-weight:600}
.scr{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px}.scr button{white-space:nowrap;padding:9px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font-weight:700;font-size:13.5px}.scr .on{background:rgba(25,211,138,.16);border-color:var(--em);color:var(--em)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:10px}.seg button{padding:9px 0;border-radius:10px;color:var(--mu);font-weight:700;font-size:13.5px}.seg .on{background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--em)}
.st{color:var(--mu);font-size:12.5px;margin:4px 2px 12px}.st button{color:var(--em);font-weight:700;margin-left:8px}
.cd{display:grid;grid-template-columns:58px 1fr 68px;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:10px}

function treasury(){const B=TR.bets,prof=b=>b.st=="won"?b.stake*(b.odds-1):b.st=="lost"?-b.stake:0;
 const sett=B.filter(b=>b.st=="won"||b.st=="lost"),sum=B.reduce((s,b)=>s+prof(b),0),cur=TR.start+sum,staked=sett.reduce((s,b)=>s+b.stake,0);
 const wins=sett.filter(b=>b.st=="won").length,roi=staked?sum/staked*100:0,wr=sett.length?wins/sett.length*100:0;
 let run=TR.start;const pts=[run];B.slice().sort((a,b)=>a.t-b.t).filter(b=>b.st!="pending").forEach(b=>{run+=prof(b);pts.push(run)});
 const mn=Math.min(...pts),mxv=Math.max(...pts),rg=(mxv-mn)||1,spark=pts.length>1?`<svg viewBox="0 0 300 60" style="width:100%;height:60px;margin-top:12px"><polyline fill="none" stroke="#19d38a" stroke-width="3" stroke-linejoin="round" points="${pts.map((v,i)=>(i/(pts.length-1)*300).toFixed(1)+","+(54-(v-mn)/rg*48).toFixed(1)).join(" ")}"/></svg>`:"";
 const cs=TR.cur||"RON",cl=n=>n>0?"pos":n<0?"neg":"";
 V.innerHTML=`<h1>Treasury</h1><div class="sub">Jurnalul tău de mize. Date salvate doar pe acest telefon.</div>
 <div class="hero" style="margin-top:12px"><div class="sub" style="color:#b8cde4">Buget curent</div><div class="big">${f2(cur)} <small style="font-size:16px">${esc(cs)}</small></div>
 <div class="row"><span class="tag ${sum>=0?"g":""}">${sum>=0?"+":""}${f2(sum)} profit</span><span class="tag">ROI ${f2(roi)}%</span><span class="tag">Câștigate ${f2(wr)}% (${wins}/${sett.length})</span></div>${spark}</div>
 <h2>Pariu nou</h2><div class="cp"><input class="in" id="t_ev" placeholder="Eveniment (ex. Echipa A – Echipa B)"><div class="fi"><input class="in" id="t_mk" placeholder="Piață (ex. Peste 2.5)"><input class="in" id="t_od" inputmode="decimal" placeholder="Cotă"><input class="in" id="t_st" inputmode="decimal" placeholder="Miză (${esc(cs)})"><button class="btn" data-act="tadd">Adaugă</button></div></div>
 <h2>Pariuri (${B.length})</h2>${B.length?B.slice().sort((a,b)=>b.t-a.t).map(b=>`<div class="rrow" style="grid-template-columns:1fr auto"><div><b>${esc(b.ev)}</b><small>${esc(b.mk||"—")} @ ${f2(b.odds)} · miză ${f2(b.stake)}</small>${b.st=="pending"?`<div class="bt"><button data-act="tres" data-v="${b.id}|won">✓ Câștigat</button><button data-act="tres" data-v="${b.id}|lost">✗ Pierdut</button><button data-act="tres" data-v="${b.id}|void">↺ Anulat</button></div>`:""}</div>
 <div style="text-align:right"><div class="${cl(prof(b))}" style="font-weight:800">${b.st=="pending"?"în curs":b.st=="void"?"anulat":(prof(b)>=0?"+":"")+f2(prof(b))}</div><button data-act="tdel" data-v="${b.id}" aria-label="Șterge" style="color:var(--mu);margin-top:6px">✕</button></div></div>`).join(""):`<div class="ctr" style="padding:24px">Niciun pariu înregistrat.</div>`}
 <h2>Buget inițial</h2><div class="cp"><div class="fi"><input class="in" id="t_s0" inputmode="decimal" value="${TR.start}"><button class="btn" data-act="tstart">Setează</button></div></div>
 <div class="st" style="margin-top:14px">18+. Joacă responsabil: nu mizezi bani pe care nu îi poți pierde. Aplicația nu garantează câștiguri, statisticile sunt doar informative.</div>`}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v;
 if(a=="rpick"){const[id,pk]=v.split("|"),m=M.find(x=>String(x.id)==id);if(!m)return;const i=RY.preds.findIndex(p=>p.mid==m.id);
  if(i>=0&&RY.preds[i].pick==pk)RY.preds.splice(i,1);else{const np={mid:m.id,h:m.teams.home.name,a:m.teams.away.name,t:+m._t,fd:m._fd||m._d,pick:pk};if(i>=0)RY.preds[i]=np;else RY.preds.push(np)}saveR();royal()}
 else if(a=="rdel"){RY.preds=RY.preds.filter(p=>String(p.mid)!=v);saveR();royal()}
 else if(a=="tadd"){const ev=$("#t_ev").value.trim(),od=parseFloat($("#t_od").value.replace(",",".")),st=parseFloat($("#t_st").value.replace(",","."));
  if(!ev||!(od>1)||!(st>0)){toast("Completează eveniment, cotă (>1) și miză");return}TR.bets.push({id:Date.now(),t:Date.now(),ev,mk:$("#t_mk").value.trim(),odds:od,stake:st,st:"pending"});saveT();treasury()}
 else if(a=="tres"){const[id,st]=v.split("|"),b=TR.bets.find(x=>String(x.id)==id);if(b){b.st=st;saveT();treasury()}}
 else if(a=="tdel"){TR.bets=TR.bets.filter(x=>String(x.id)!=v);saveT();treasury()}
 else if(a=="tstart"){const n=parseFloat($("#t_s0").value.replace(",","."));if(n>=0){TR.start=n;saveT();treasury()}}
});


const STD={};
const stRank=(m,s)=>{const t=STD[m._lid+"_"+m._season],id=s=="h"?m.afh:m.afa;return t&&id!=null&&t[id]!=null?t[id]:null};
async function afStand(m){if(!m._lid||!m._season||!m.afh||afOff)return;const k=m._lid+"_"+m._season;if(STD[k]!==undefined)return;const c=LS.get("st_"+k,null);if(c&&Date.now()-c.t<3*36e5){STD[k]=c.v;return}
 try{const j=await afEnq(()=>sf("/af-standings?league="+m._lid+"&season="+m._season,60000),true);const v=j&&j.table?Object.fromEntries(Object.entries(j.table).map(([id,x])=>[id,x.r])):null;STD[k]=v;LS.set("st_"+k,{t:Date.now(),v})}catch(e){STD[k]=null}}

function tvRow(l,p){return`<div>${ring(p,58)}${l}</div>`}
function tvDraw(){const o=document.getElementById("tv");if(!o||!TVD)return;const{name,v,tab}=TVD,R=v&&v.R?v.R.slice().sort((a,b)=>b.t-a.t):[];
 let b;

 else{const cards=R.map(r=>{const k=r.gf>r.ga?"w":r.gf<r.ga?"l":"d",d=r.t?new Date(r.t).toLocaleDateString("ro-RO",{day:"2-digit",month:"short",year:"numeric"}):"";
   return`<div class="rc ${k}"><b>${r.gf}-${r.ga}${r.hm==null?"":`<em>${r.hm?"A":"D"}</em>`}</b><span>${d}</span><span>${esc(r.lg||"")}</span>${r.o?`<span>${esc(r.hm?name:r.o)}</span><span>vs</span><span>${esc(r.hm?r.o:name)}</span>`:""}</div>`}).join("");
  let rows="";
  if(tab=="g"){const T=r=>r.gf+r.ga;rows=`<div class="gr tvg">`+[0.5,1.5,2.5,3.5].map(x=>tvRow("Peste "+x,tvPct(R,r=>T(r)>x))).join("")+tvRow("Ambele marchează",tvPct(R,r=>r.gf>0&&r.ga>0))+tvRow("Echipa marchează",tvPct(R,r=>r.gf>0))+`</div>`}
  else{const key=tab=="c"?"co":"yc",A=R.filter(r=>r[key]!=null),ths=tab=="c"?[3.5,4.5,5.5,6.5]:[0.5,1.5,2.5,3.5];
   rows=A.length<3?`<div class="ctr">Date insuficiente (API-Football nu are ${tab=="c"?"cornere":"cartonașe"} pentru destule meciuri).</div>`:`<div class="sub">Media: ${(A.reduce((s,r)=>s+r[key],0)/A.length).toFixed(1)} pe meci, din ${A.length} meciuri (doar echipa aceasta)</div>`+`<div class="gr tvg">`+ths.map(x=>tvRow("Peste "+x,tvPct(A,r=>r[key]>x))).join("")+`</div>`}
  b=`<h3 style="margin:6px 0 10px;font-size:15px">Ultimele ${R.length} rezultate</h3><div class="rcs">${cards}</div><div class="seg" style="grid-template-columns:repeat(3,1fr);margin-top:14px">${[["g","Goluri"],["c","Cornere"],["y","Cartonașe"]].map(t=>`<button data-act="ttab" data-v="${t[0]}" class="${tab==t[0]?"on":""}">${t[1]}</button>`).join("")}</div>${rows}`}
 o.innerHTML=`<button class="bk" data-act="tclose">‹ Înapoi</button><div class="tvt">${crest({name:name},null)}<h2>${esc(name)}</h2></div>${b}`}

 o.style.display="block";o.scrollTop=0;o.innerHTML=`<button class="bk" data-act="tclose">‹ Înapoi</button><div class="ctr">Se încarcă…</div>`;

 try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}

const PSH_OK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const b64u=k=>{const r=atob((k+"=".repeat((4-k.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
const pushBtn=()=>{const b=document.querySelector("[data-act=push]");if(b)b.textContent=LS.get("push",false)?"🔔 Notificări gol: pornite":"🔕 Pornește notificări la gol (favorite)"};
async function pushSync(){if(!LS.get("push",false)||!PSH_OK()||Notification.permission!="granted")return;
 try{const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)return;
  const favs=[...FAV].map(id=>M.find(x=>String(x.id)==id)).filter(m=>m&&m.afid).map(m=>({id:m.afid,h:m.teams.home.name,a:m.teams.away.name}));
  await fetch(SERVER+"/push-sub",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub:sub.toJSON(),favs})})}catch(e){}}
async function pushToggle(){
 if(!PSH_OK()){toast("Notificările nu merg aici. Pe iPhone adaugă aplicația pe ecranul principal.");return}
 try{if(LS.get("push",false)){const reg=await navigator.serviceWorker.getRegistration("sw.js"),sub=reg&&await reg.pushManager.getSubscription();
   if(sub){try{await fetch(SERVER+"/push-unsub",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})})}catch(e){}await sub.unsubscribe()}
   LS.set("push",false);pushBtn();toast("Notificări oprite");return}
  const perm=await Notification.requestPermission();if(perm!="granted"){toast("Permisiunea pentru notificări a fost refuzată");return}
  const k=await sf("/push-key",20000);if(!k.ready||!k.key){toast("Serverul nu are încă notificările configurate");return}
  const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)});
  LS.set("push",true);pushBtn();await pushSync();toast("Notificări pornite pentru favorite ★")}
 catch(e){toast("Nu s-au putut porni notificările: "+e.message)}}

 try{const aj=await sf("/af-fixtures?date="+ymd(0)+"&timezone=Europe/London&fresh=1&r="+Date.now(),undefined,0);let ch=0;

   if(a._live&&m._live&&((a.goals.home||0)+(a.goals.away||0))>((m.goals.home||0)+(m.goals.away||0)))goalAlert(m,a.goals);
   if(a._live){m.min=a.min;m._mt=Date.now();m._ss=a._ss;m._p1=a._p1;m._p2=a._p2}
