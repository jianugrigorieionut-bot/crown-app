<style>
:root{--bg:#07111f;--s1:#0d1b30;--s2:#12243d;--ln:#1e3557;--em:#19d38a;--bl:#4da3ff;--tx:#e8f0fa;--mu:#8aa0ba;--am:#f5b84b;--rd:#ef5b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:104px;background:radial-gradient(circle at 85% -5%,rgba(25,211,138,.16),transparent 45%),radial-gradient(circle at 0 20%,rgba(77,163,255,.10),transparent 40%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo span{font-weight:400;color:var(--mu)}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#19d38a,#0f7f6b);font-size:20px}
.mbtn{width:42px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);font-size:18px}
main{padding:6px 18px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:15px;margin:22px 0 10px;color:var(--mu);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--mu);font-size:14px}
.hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,#0f4a52 0%,#0d2a47 60%,#0d1b30 100%);border:1px solid var(--ln);position:relative;overflow:hidden}
.hero::after{content:"👑";position:absolute;right:-6px;top:-10px;font-size:110px;opacity:.08}
.hero .big{font-size:46px;font-weight:800;line-height:1}.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08)}
.tag.g{background:rgba(25,211,138,.18);color:var(--em)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;text-align:left}
.tile.w{grid-column:1/3;background:linear-gradient(135deg,#0e5a4a,#0d2f4a);border-color:#1b6b5b;display:flex;align-items:center;gap:14px}
.tile .ic{width:44px;height:44px;border-radius:14px;background:rgba(25,211,138,.15);display:grid;place-items:center;font-size:22px;margin-bottom:10px}.tile.w .ic{margin:0;background:rgba(255,255,255,.12)}
.tile b{display:block;font-size:16px}.tile small{color:var(--mu);font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,17,31,.96);border-top:1px solid var(--ln);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:11.5px;font-weight:700}
nav .ni{width:50px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:18px;filter:grayscale(1) opacity(.7)}
nav .on{color:var(--em)}nav .on .ni{background:rgba(25,211,138,.16);filter:none}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.days button{flex:1;min-width:62px;padding:8px 4px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font-size:12px;font-weight:700;text-transform:capitalize}
.days b{display:block;font-size:17px;color:var(--tx)}.days .on{background:var(--em);border-color:var(--em);color:#04281c}.days .on b{color:#04281c}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.in,.sel{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:15px;outline:0}.in:focus{border-color:var(--em)}
.sel{appearance:none;-webkit-appearance:none;font-weight:600}
.scr{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px}.scr button{white-space:nowrap;padding:9px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font-weight:700;font-size:13.5px}.scr .on{background:rgba(25,211,138,.16);border-color:var(--em);color:var(--em)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:10px}.seg button{padding:9px 0;border-radius:10px;color:var(--mu);font-weight:700;font-size:13.5px}.seg .on{background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--em)}
.st{color:var(--mu);font-size:12.5px;margin:4px 2px 12px}.st button{color:var(--em);font-weight:700;margin-left:8px}
.cd{display:grid;grid-template-columns:58px 1fr 68px;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:10px}
.cd .tm{text-align:center;font-weight:800;font-size:16px}.cd .tm small{display:block;font-size:11px;margin-top:4px;color:var(--mu);font-weight:700}
.cd .tm .lv{color:var(--rd)}.cd .lg{grid-column:1/4;font-size:12px;color:var(--mu);margin:-4px 0 -2px}
.tr{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;padding:2px 0}.tr em{font-style:normal;color:var(--em);font-weight:800}
.dts{display:flex;gap:4px;margin-top:6px;align-items:center}.dts span{width:7px}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%}.dt.w{background:var(--em)}.dt.d{background:var(--am)}.dt.l{background:var(--rd)}
